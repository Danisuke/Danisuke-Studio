<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 // SYSTEM ALERT - CARDINAL ERROR</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --sao-red: #ff2a55;
      --sao-cyan: #00e5ff;
      --bg-dark: #07090e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-dark);
      color: #ffffff;
      font-family: 'Rajdhani', sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(0, 229, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 229, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 0;
    }
    .sao-window {
      position: relative;
      z-index: 5;
      width: 90%;
      max-width: 500px;
      background: rgba(16, 20, 30, 0.9);
      border: 1px solid rgba(255, 42, 85, 0.6);
      box-shadow: 0 0 30px rgba(255, 42, 85, 0.25);
    }
    .window-header {
      background: linear-gradient(90deg, #ff2a55, #b41432);
      padding: 10px 16px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.9rem;
      letter-spacing: 2px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .window-body {
      padding: 30px 24px;
      text-align: center;
    }
    .error-code {
      font-family: 'Orbitron', sans-serif;
      font-size: 4rem;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 15px rgba(255, 42, 85, 0.7);
      margin-bottom: 5px;
    }
    .error-subtitle {
      font-family: 'Orbitron', sans-serif;
      font-size: 1rem;
      color: var(--sao-red);
      letter-spacing: 2px;
      margin-bottom: 20px;
    }
    .system-message {
      font-size: 1rem;
      color: #cbd5e1;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .home-btn {
      display: inline-block;
      background: rgba(0, 229, 255, 0.1);
      border: 1px solid var(--sao-cyan);
      color: var(--sao-cyan);
      padding: 10px 24px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 1.5px;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .home-btn:hover {
      background: rgba(0, 229, 255, 0.25);
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
    }
  </style>
</head>
<body>

  <div class="bg-grid"></div>

  <div class="sao-window">
    <div class="window-header">
      <span>SYSTEM ALERT</span>
      <span>ERR_404</span>
    </div>
    <div class="window-body">
      <div class="error-code">404</div>
      <div class="error-subtitle">Sector Not Found</div>
      <p class="system-message">
        Koordinat halaman yang kamu tuju tidak terdaftar di dalam sistem Aincrad.
      </p>
      <a href="/" class="home-btn">TELEPORT HOME</a>
    </div>
  </div>

</body>
</html>
